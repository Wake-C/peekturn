name: Release APK

# A pushed v* tag builds a signed APK and attaches it to a GitHub Release.
# The release page is the download page: github.com/<owner>/<repo>/releases
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Verify release tag
        run: |
          [[ "$TAG" == v[0-9]* ]] || { echo 'Expected an existing version tag.' >&2; exit 1; }
          git check-ref-format "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Restore the same main-branch cache as Debug, but never save signed build state.
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: peekturn-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/*.versions.toml', '**/gradle.lockfile') }}-${{ steps.source.outputs.commit }}
          restore-keys: |
            peekturn-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/*.versions.toml', '**/gradle.lockfile') }}-
            peekturn-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      # The runner image ships an SDK, but the exact compileSdk may lag behind
      # app/build.gradle.kts. Install only missing platforms/build tools.
      - name: Ensure Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          packages=()
          [[ -d "$sdk/platforms/android-35" ]] || packages+=("platforms;android-35")
          [[ -x "$sdk/build-tools/35.0.0/apksigner" ]] || packages+=("build-tools;35.0.0")
          if ((${#packages[@]})); then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi

      # app/build.gradle.kts reads the signing values from these environment
      # variables. Fail early instead of publishing an APK that no device will install.
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PEEKTURN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PEEKTURN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PEEKTURN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PEEKTURN_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "$(printenv "$name")" ] || { echo "Missing secret $name" >&2; exit 1; }
          done

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PEEKTURN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          target="$RUNNER_TEMP/peekturn-upload.jks"
          printenv KEYSTORE_BASE64 | base64 --decode > "$target"
          test -s "$target"
          echo "PEEKTURN_STORE_FILE=$target" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PEEKTURN_STORE_PASSWORD: ${{ secrets.PEEKTURN_STORE_PASSWORD }}
          PEEKTURN_KEY_ALIAS: ${{ secrets.PEEKTURN_KEY_ALIAS }}
          PEEKTURN_KEY_PASSWORD: ${{ secrets.PEEKTURN_KEY_PASSWORD }}
        run: ./gradlew --console=plain --build-cache --no-configuration-cache :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      # Naming, checksum and signature check mirror tools/release.sh so the CI
      # artifact is the same shape as a local one.
      - name: Verify and collect artifact
        id: collect
        run: |
          set -eu
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          read -r version_name version_code < <(python3 - <<'PY'
          import json
          element = json.load(open('app/build/outputs/apk/release/output-metadata.json'))['elements'][0]
          print(element['versionName'], element['versionCode'])
          PY
          )
          # The tag is the public version. Stop if the build number drifted.
          test "$TAG" = "v$version_name" || {
            echo "Tag $TAG does not match versionName $version_name" >&2; exit 1; }

          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

          name="peekturn-${version_name}-${version_code}-release.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          {
            echo "name=$name"
            echo "version=$version_name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.collect.outputs.name }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "Peekturn $VERSION" --generate-notes
          gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256" --clobber
