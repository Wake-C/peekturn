name: Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Never expose repository secrets to PR code, including same-repo PRs.
      # PR APKs use a disposable runner key; only trusted main builds share a key.
      - name: Restore stable test signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE: ${{ secrets.PEEKTURN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE" || { echo "Missing debug signing secret" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Test, lint and build Debug APK
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          name="peekturn-debug-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: peekturn-debug-${{ github.run_number }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
